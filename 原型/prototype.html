function openModal(title,body,footer='',drawer=false,kind=''){lastFocus=document.activeElement;const d=document.getElementById('dialog');if(d.open)d.close();dirty=false;modalKind=kind;d.className='modal'+(drawer?' drawer':'');d.innerHTML=`<header class="between"><h3 id="dialog-title">${title}</h3><button aria-label="关闭对话框" onclick="closeModal()">×</button></header><div class="modalbody">${body}</div><footer>${footer||button('关闭','closeModal()')}</footer>`;d.showModal();if(kind==='editor')d.querySelectorAll('input').forEach(e=>e.addEventListener('input',()=>dirty=true))}

div></main></div>`}
function scenarioBanner(){const texts={key:'尚未配置模型密钥。可继续查看与整理材料，模型分析暂不可用。',source:'1 份材料读取失败。该材料不计入已分析范围，其它材料仍可继续使用。',budget:'本次分析因预算暂停。已保存当前结果；继续可能产生费用，不会自动重试。',stale:'此页面对应旧版本。先查看最新内容，再决定是否提交；不要自动重放确认。'};return S.scenario==='normal'?'':`<div class="notice banner">${texts[S.scenario]} ${button(S.scenario==='key'?'打开设置':'查看详情',S.scenario==='key'?"nav('settings')":"toast('这是故障状态演示；正式实现必须使用服务端真实状态')",'textbtn')}</div>`}
function workspace(){return `<div class="workspace mobile-${S.mobile}"><div class="mobiletabs"><button class="${S.mobile==='chat'?'active':''}" onclick="S.mobile='chat';render()">讨论</button><button class="${S.mobile==='result'?'active':''}" onclick="S.mobile='result';render()">工作成果</button></div><section class="conversation"><div class="panelhead between"><strong>讨论与澄清</strong>${badge('探索模式','green')}</div><div class="chatbody"><div><div class="speaker"><span class="avatar">PM</span><span class="muted">你 · 提供材料</span></div><p class="userbubble">现有电价时段配置不够直观。请参考当前页面，保留业务规则，先给我一版更简单的操作方案。</p></div><div><div class="speaker"><span class="spark">✳</span><strong>需求助手</strong><span class="meta">合成回复</span></div><div class="answer">我先把改动范围收敛到<strong>“同一页面完成时段配置”</strong>，不会把竞品的其它功能直接加入本期。</div><div class="quote">已识别：减少操作跳转、保留已有权限。<br>待决定：时间段冲突时如何处理。</div><button class="textbtn small" onclick="nav('sources')">查看 ${S.sources.length} 份参考材料 ↗</button><div class="question"><div class="between"><strong>时段重叠时怎样处理？</strong>${badge(S.rule?'已回答':'待你决定',S.rule?'green':'amber')}</div><p class="muted">这会影响表单反馈、保存结果和验收条件。</p>${S.rule?'<p>不允许重叠；拒绝保存，并保留原有数据。</p>':`<div class="choices"><button onclick="answerRule()">不允许重叠，拒绝保存并保留原数据</button><button onclick="toast('该选项需进一步澄清，不会自动替你决定覆盖规则')">允许重叠，继续讨论覆盖规则</button></div><button class="textbtn small" onclick="toast('问题仍保留，允许继续探索；最终确认前需要解决')">暂时不知道，先看页面</button>`}</div></div>${S.messages.map(m=>`<div class="quote">${esc(m)}</div>`).join('')}</div><div class="composer"><div class="chiprow"><button onclick="tab('options')">比较交互方案</button><button onclick="openChange()">把弹窗改成抽屉</button></div><div class="composerbox"><textarea aria-label="讨论内容" placeholder="补充目标、说明取舍，或提出页面修改……" oninput="S.input=this.value">${esc(S.input)}</textarea><div class="between"><span class="small muted">继续讨论 · 演示</span><button class="primary send" onclick="sendMessage()">发送 ${I('arrow')}</button></div></div><p class="meta" style="margin-top:8px">本原型不调用模型；正式版将显示本次用途和发送范围。</p></div></section><section class="result"><nav class="resulttabs" aria-label="工作成果">${[['summary','需求摘要'],['options','方案对比'],['ui','页面原型'],['prd','PRD 草稿']].map(([k,t])=>`<button class="${S.tab===k?'active':''}" onclick="tab('${k}')">${t}</button>`).join('')}</nav><div class="resultbody">${S.tab==='summary'?summary():S.tab==='options'?options():S.tab==='ui'?previewPanel():docContent()}</div></section></div>`}
function summary(){return `<div class="between"><div><p class="eyebrow">Working brief</p><h2 style="margin-top:6px">先对齐要解决的问题</h2></div>${badge('持续更新','green')}</div><div class="contextbar"><span>本期只优化操作体验，不扩展业务范围</span><button class="textbtn" onclick="tab('options')">查看方案 →</button></div><article class="card"><h3>目标与边界</h3><div class="fact"><label>目标用户</label><span>配置管理员、只读查看人员 <span class="meta">· 示例角色</span></span></div><div class="fact"><label>本期目标</label><span>减少页面切换，让查看、配置和反馈更连贯。</span></div><div class="fact"><label>保持不变</label><span>现有角色权限与已确认的时段业务规则。</span></div><div class="fact"><label>暂不包含</label><span>批量导入、定时任务、复杂审批流程。</span></div></article><article class="card"><div class="between"><h3>需求候选与关键决定</h3><button class="textbtn small" onclick="openBrief()">查看关联</button></div>${[['REQ-01','同页完成新增与查看','配置操作结束后保留当前上下文。'],['RULE-01','时间段冲突处理',S.rule?'拒绝重叠时段，原有数据保持不变。':'尚未决定，先作为待确认规则。'],['UI-01',S.layout+'式编辑','布局方案，不等于业务功能已经实现。']].map(([id,t,d])=>`<div class="reqrow"><span class="checkmark">${id==='RULE-01'&&!S.rule?'?':'✓'}</span><div style="flex:1"><strong>${t}</strong><p class="muted">${d}</p><span class="meta">${id} · 合成示例</span></div>${badge(id==='RULE-01'&&!S.rule?'待确认':'讨论稿',id==='RULE-01'&&!S.rule?'amber':'')}</div>`).join('')}</article><article class="card"><div class="between"><h3>建议下一步</h3>${I('arrow')}</div><p class="muted small">先比较两种布局。选定方向后，再通过原型确认关键操作。</p><div class="decisionfoot inline">${button('比较页面方案',"tab('options')",'primary')}${button('先看原型',"tab('ui')")}</div></article>`}
function options(){return `<div class="pageintro"><p class="eyebrow">Explore alternatives</p><h2>同一个目标，两种操作方式</h2><p>采纳方向只改变候选方案状态，不批准 PRD。</p></div>${[['A','列表 + 右侧抽屉','保留列表上下文，适合频繁新增和编辑。','抽屉'],['B','列表 + 居中弹窗','改动较小，适合字段少、低频操作。','弹窗']].map(([id,name,d,l])=>`<article class="option ${S.choice===id?'chosen':''}"><div class="between"><h3>方案 ${id} · ${name}</h3>${badge(S.choice===id?'已选方向':'候选',S.choice===id?'green':'')}</div><div class="mini"><span style="width:16%"></span><span style="flex:1"></span><span style="width:${id==='A'?'35':'23'}%;background:#a8c5ae"></span></div><p>${d}</p><p class="muted small">取舍：${id==='A'?'需要考虑窄屏呈现和未保存退出。':'模态遮挡列表，重复操作时上下文较弱。'}</p><div class="between"><span class="meta">不增加新的业务权限与操作</span><button class="primary" onclick="choose('${id}','${l}')">${S.choice===id?'重新查看':'选择此方向'}</button></div></article>`).join('')}<div class="notice">对标只是参考。以上方案与样例规则均为设计演示，不是你的真实业务需求。</div>`}
function answerRule(){S.rule=true;mutate('回答时段冲突规则（演示）');render();toast('回答已加入演示底稿；文档需重新同步')}
function choose(id,layout){if(S.choice!==id||S.layout!==layout){S.choice=id;S.layout=layout;mutate('选定方案 '+id+'：'+layout+'（演示）')}tab('ui');toast('已选择方向，尚未确认 PRD')}
function sendMessage(){if(!S.input.trim())return;S.messages.push('你：'+S.input,'演示提示：输入已保留；此原型不执行语言理解。使用快捷操作体验指定流程。');S.input='';render()}
function openBrief(){openModal('需求关联 · 只读示例','<div class="fact"><label>REQ-01</label><span>同页配置时段</span></div><div class="fact"><label>RULE-01</label><span>重叠处理 → '+(S.rule?'拒绝保存，原数据不变':'待决定')+'</span></div><div class="fact"><label>AC-01</label><span>输入冲突时明确提示，列表数据不改变</span></div><div class="fact"><label>PAGE-01</label><span>时段列表 → 编辑面板</span></div><p class="meta">关联仅为合成示例。正式版必须引用服务端当前项目。</p>')}
function openChange(){openModal('修改方案 · 先看影响',`<span class="badge amber">待采纳，不会直接覆盖</span><div class="diff">原方案：${S.layout}式新增与编辑</div><div class="diff add">拟调整：右侧抽屉编辑，保留列表上下文</div><p class="small">不改变：角色权限、时间段冲突规则、验收预期。</p><div class="notice" style="margin-top:15px">采纳后产生新草稿。PRD 与语义审查需要更新，已有确认基线保留。</div>`,button('暂不采纳','closeModal()')+button('采纳布局修改','applyChange()','primary'))}
function applyChange(){if(S.layout==='抽屉'){closeModal();toast('当前已是抽屉布局，没有产生新变更');return}S.layout='抽屉';S.choice='A';mutate('采纳布局修改：弹窗改抽屉（演示）');closeModal();tab('ui');toast('已创建新草稿，PRD 已标记需要同步')}
function controls(){return `<div class="canvasbar"><div class="segmented" aria-label="业务演示状态">${[['normal','正常'],['loading','加载'],['empty','空态'],['error','失败'],['forbidden','无权限']].map(([s,t])=>`<button class="${S.bizState===s?'active':''}" onclick="S.bizState='${s}';render()">${t}</button>`).join('')}</div><label class="small muted">角色 <select aria-label="业务演示角色" onchange="S.role=this.value;render()"><option value="admin" ${S.role==='admin'?'selected':''}>管理员</option><option value="viewer" ${S.role==='viewer'?'selected':''}>只读人员</option></select></label></div>`}
function business(){let body='';if(S.bizState!=='normal'){const map={loading:['正在读取时段','加载中为手动演示，不代表实际请求。'],empty:['还没有配置时段','空状态仅为视觉演示；新增会回到保留的数据列表。'],error:['时段列表暂时无法读取','可以重试，输入和已保存数据不会被清空。'],forbidden:['当前角色无权访问','这是权限状态演示，不证明后端鉴权。']};body=`<div class="blank">${I(S.bizState==='error'?'history':'files')}<strong>${map[S.bizState][0]}</strong><p class="small">${map[S.bizState][1]}</p>${S.bizState==='error'?button('重试（模拟）',"S.bizState='normal';render()") : S.bizState==='empty'&&S.role==='admin'?button('新增时段',"openEditor()",'primary'):''}</div>`}else body=`<div class="bizbody"><div class="between"><div><h3>电价时段</h3><p class="meta">默认方案 / 夏季工作日 · 合成业务样例</p></div><button class="primary" onclick="openEditor()" ${S.role==='viewer'?'disabled title="只读角色不能新增"':''}>＋ 新增时段</button></div>${S.role==='viewer'?'<p class="notice" style="margin-top:15px">只读查看：不可修改本方案。</p>':''}<div class="filter"><input aria-label="筛选时段" placeholder="搜索时段名称" oninput="filterRows(this.value)"><button onclick="document.querySelector('[aria-label=筛选时段]').value='';filterRows('')">全部时段</button></div><div class="tablewrap"><table><thead><tr><th>时段名称</th><th>时间范围</th><th>单价（元/kWh）</th><th>操作</th></tr></thead><tbody>${S.business.map((r,i)=>`<tr data-name="${esc(r.name)}"><td><strong>${esc(r.name)}</strong></td><td>${r.start} — ${r.end}</td><td>${r.price}</td><td><button class="textbtn small" onclick="openEditor(${i})" ${S.role==='viewer'?'disabled':''}>编辑</button></td></tr>`).join('')}</tbody></table></div><p class="bizfoot">共 ${S.business.length} 个时段 · 数据只在本次设计演示中存在</p></div>`;return `<div class="business"><div class="biztop between"><span>能源管理 / 配置管理 / 电价方案</span><span>${S.role==='admin'?'管理员':'只读人员'} · 模拟</span></div>${body}</div>`}
function filterRows(v){document.querySelectorAll('tr[data-name]').forEach(r=>r.hidden=!r.dataset.name.includes(v))}
function previewPanel(){return `<div class="between"><div><p class="eyebrow">Interactive prototype</p><h2>页面先看见，需求再收敛</h2></div><button aria-label="展开原型画布" title="展开原型画布" onclick="nav('prototype')">${I('expand')}</button></div><div class="contextbar"><span>PAGE-01 · ${S.layout}布局 · 低保真交互</span><button class="textbtn" onclick="openChange()">提出修改</button></div>${controls()}<div class="canvas">${business()}</div><p class="meta" style="margin-top:13px">可操作：新增、编辑、筛选、错误反馈。所有结果均为前端模拟。</p>`}
function prototypePage(){return `<div class="fullpage"><div class="pageintro between"><div><p class="eyebrow">Prototype canvas</p><h2>电价配置 · 交互讨论稿</h2><p>先体验关键路径，再决定是否纳入本期需求。</p></div>${button('提出布局修改','openChange()','primary')}</div><div class="prototype-layout"><section>${controls()}<div class="canvas">${business()}</div><div class="contextbar"><span>当前布局：${S.layout} · 原型草稿 v${S.rev}</span>${button('返回讨论',"nav('work');tab('ui')",'textbtn')}</div></section><aside class="inspector"><div class="card"><p class="eyebrow">Design intent</p><h3 style="margin-top:6px">保留操作上下文</h3><p class="muted">查看、编辑和反馈在同一页面完成。切换布局不改变业务规则。</p></div><div class="card"><h4>关联需求</h4><p class="meta">REQ-01 同页配置</p><p class="meta">RULE-01 冲突处理</p><p class="meta">AC-01 原数据保持</p><button class="textbtn small" onclick="openBrief()">查看完整关联 →</button></div><div class="card"><h4>演示路径</h4><p>新增 07:00—10:00：成功。<br>新增 06:00—08:00：重叠。<br>勾选“模拟保存失败”：保留输入。</p><p class="meta">规则是固定合成夹具，不是需求分析结果。</p></div></aside></div></div>`}
function openEditor(index=-1){if(S.role!=='admin'||S.bizState==='forbidden')return;const r=index>=0?S.business[index]:{name:'平时段',start:'07:00',end:'10:00',price:'0.58'};openModal((index>=0?'编辑':'新增')+'电价时段',`<p class="small muted">${S.layout}式交互 · 仅操作合成数据</p><label class="field">时段名称<input id="bname" value="${esc(r.name)}"></label><div class="grid2"><label class="field">开始时间<input id="bstart" type="time" value="${r.start}"></label><label class="field">结束时间<input id="bend" type="time" value="${r.end}"></label></div><label class="field">单价（元/kWh）<input id="bprice" type="number" min="0" step="0.01" value="${r.price}"></label><label class="checkline"><input type="checkbox" id="bfail">模拟保存失败（不连接业务服务）</label><p id="berror" role="alert" class="notice red" hidden></p><div class="quote">固定演示规则：时间段不重叠、开始早于结束、单价非负。不处理跨日时段；不是你的真实业务规则。</div>`,button('取消','closeModal()')+button('保存（模拟）',`saveBusiness(${index})`,'primary'),S.layout==='抽屉','editor')}
function saveBusiness(index){const val=id=>document.getElementById(id).value;const r={name:val('bname').trim(),start:val('bstart'),end:val('bend'),price:val('bprice')};let err='';if(!r.name||!r.start||!r.end||r.price==='')err='请补全必填内容。';else if(r.start>=r.end)err='开始时间必须早于结束时间。';else if(!Number.isFinite(Number(r.price))||Number(r.price)<0)err='单价必须是非负数。';else if(S.business.some((x,i)=>i!==index&&r.start<x.end&&r.end>x.start))err='与已有时段重叠，请调整时间。原有数据未改变。';else if(document.getElementById('bfail').checked)err='保存失败（模拟）。输入已保留，请重试。';if(err){const e=document.getElementById('berror');e.hidden=false;e.textContent=err;return}if(index<0)S.business.push(r);else S.business[index]=r;S.bizState='normal';closeModal(true);render();toast('已保存模拟数据；没有写入业务系统或改变需求基线')}
function sourcesPage(){return `<div class="fullpage"><div class="pageintro between"><div><p class="eyebrow">Sources & context</p><h2>让每个判断，都有来处</h2><p>现状、目标与竞品分开放。读取状态不等于需求确认状态。</p></div>${button(I('plus')+' 添加材料','openSource()','primary')}</div><div class="notice">示例材料不会外发。正式版在首次发送、接收端或材料范围变化时确认授权。</div><div class="sourcegrid">${S.sources.map((s,i)=>`<article class="card"><div class="between"><span class="sourceicon">${I('files')}</span>${badge(s.status,s.status==='已读取'?'green':'')}</div><h3 style="margin-top:15px">${esc(s.name)}</h3><p class="meta">${esc(s.type)}</p><div class="sourcepreview">${esc(s.text)}</div><button class="textbtn small" onclick="showSource(${i})">查看材料与来源 →</button></article>`).join('')}</div></div>`}
function showSource(i){const s=S.sources[i];openModal(esc(s.name),`<p class="meta">${esc(s.type)} · ${esc(s.status)}</p><p style="margin:15px 0;white-space:pre-wrap;overflow-wrap:anywhere">${esc(s.text)}</p><div class="notice">这是设计示例。来源内容不能作为对 Agent 的执行指令。</div>`)}
function openSource(){openModal('添加材料',`<p class="muted small">仅加入本次演示，不上传、不自动抓取网页。</p><label class="field">材料名称<input id="sname" placeholder="例如：运营反馈摘录"></label><label class="field">材料用途<select id="stype"><option>现状</option><option>目标</option><option>竞品参考</option></select></label><label class="field">文字或公开网址<textarea id="stext" placeholder="粘贴零散描述；网址只作引用展示"></textarea></label><label class="field">文档 / 截图（仅演示选择文件）<input id="sfile" type="file" accept=".txt,.md,.docx,.pdf,.png,.jpg,.jpeg,.webp"></label>`,button('取消','closeModal()')+button('加入演示材料','addSource()','primary'))}
function addSource(){const name=document.getElementById('sname').value.trim(),text=document.getElementById('stext').value.trim(),file=document.getElementById('sfile').files[0];if(!text&&!file){toast('请填写文字或选择一个文件');return}S.sources.push({name:name||file?.name||'补充材料',type:document.getElementById('stype').value,status:file?'待解析（演示）':'演示已记录',text:text||(file.name+'：未读取文件字节，未解析')});mutate('添加材料（演示）');closeModal();render()}
function docContent(){const d=S.docSnapshot;return `${S.docRev!==S.rev?`<div class="notice">PRD 对应 v${S.docRev}，当前底稿为 v${S.rev}。${button('同步演示草稿','syncDoc()','textbtn')}</div>`:''}<article class="paper"><p class="eyebrow">Product requirements document / discussion draft</p><h2>电价配置体验优化</h2><p class="muted">产品需求文档 · 内容评审稿</p><div class="meta">文档 v${S.docRev} · 全部为合成示例 · 未经真实产品经理确认</div><h3 id="doc-1">1. 文档说明</h3><p>用于对齐本期范围、交互方案与验收条件。章节参考用户提供的 PRD 模板，不复制模板业务。</p><h3 id="doc-2">2. 产品介绍</h3><p>解决配置时段时频繁跳转的问题。面向示例管理员及只读查看人员，不新增批量导入和审批。</p><h3 id="doc-3">3. 产品说明</h3><p>查看时段 → 打开编辑面板 → 输入 → 校验 → 模拟保存 → 回到列表。</p><h3 id="doc-4">4. 功能需求</h3><h4>4.1 同页配置时段</h4><p>REQ-01：在同一页面完成新增、编辑和查看。页面采用${d.layout}式编辑，此处保留上次成文快照，版本过期时需重新同步。</p><div class="quote">原型：PAGE-01 · ${d.layout}布局 · 低保真模拟<br>正式 Word 在此嵌入当前版本实际渲染图。</div><h4>业务规则与边界</h4><p>RULE-01：${d.rule?'不允许时间段重叠；被拒绝的操作不改变原有数据。':'冲突处理仍待确认，不得写为已决定规则。'}</p><h4>验收条件</h4><p>AC-01：冲突输入被明确拒绝，并可核查列表数据未改变。${d.rule?'原型只能演示该行为，不证明系统实现。':'此项也为待确认候选，不能先于业务规则成为已确认预期。'}</p><h3 id="doc-5">5. 非功能性需求与待确认</h3><p>沿用已确定权限。真实性能指标、跨日时间范围和数据来源尚无依据，不编造数值。</p><p class="meta">参考维度可合并、裁剪；未知不等于不适用。此静态原型不会生成正式 Word。</p></article>`}
function syncDoc(){S.docRev=S.rev;S.docSnapshot={layout:S.layout,rule:S.rule};S.reviewRev=null;render();toast('仅演示文档版本同步；正式版需要应用调用成文阶段')}
function docsPage(){return `<div class="fullpage"><div class="pageintro between"><div><p class="eyebrow">Document studio</p><h2>PRD 草稿</h2><p>章节参考，不机械套填。适用内容、原型与版本共同评审。</p></div><div class="inline">${button('MRD 章节参考','showMRD()')}${button('导出演示 MD','exportDemo()')}${button('同步草稿','syncDoc()','primary')}</div></div><div class="documentgrid"><nav class="outline" aria-label="文档章节">${['文档说明','产品介绍','产品说明','功能需求','非功能与待确认'].map((t,i)=>`<button onclick="document.getElementById('doc-${i+1}').scrollIntoView({behavior:'smooth'})">${i+1}. ${t}</button>`).join('')}<p class="meta" style="padding:8px">PRD / MRD 共用底稿<br>不重复决定业务规则</p></nav><div>${docContent()}</div></div></div>`}
function showMRD(){openModal('MRD · 内容参考视图','<p class="small muted">这是章节组织参考，不是已生成的 MRD。</p>'+['项目背景','名词解释','可行性分析：调研依据与目标','综合描述：功能及外部影响','功能详述：类型、优先级、流程、页面布局、描述','其它问题描述','附件'].map((t,i)=>`<div class="fact"><label>${i+1}</label><span>${t}</span></div>`).join('')+'<div class="notice">允许合并与裁剪。页面布局对应 MRD-5.1.F.3，不与功能点描述混淆。</div>')}
function exportDemo(){const d=S.docSnapshot,text=`# 设计演示摘要（不是正式 PRD）\n\n当前底稿 v${S.rev}，文档 v${S.docRev}\n\n文档布局：${d.layout}\n文档冲突规则：${d.rule?'拒绝重叠，原有数据不变（合成）':'待确认'}\n\n未连接模型，未生成 Word，无真实审批效力。\n`;const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type:'text/markdown;charset=utf-8'}));a.download='设计演示摘要.md';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function blockers(){let r=[];if(!S.rule)r.push('时段冲突规则尚未决定');if(!S.choice)r.push('尚未选择交互方案');if(S.docRev!==S.rev)r.push('PRD 与当前底稿版本不一致');if(S.reviewRev!==S.rev)r.push('当前版本尚未完成演示审查');if(S.scenario==='stale')r.push('页面版本过期，请重新核对');return r}
function confirmPage(){const issues=blockers();return `<div class="fullpage"><div class="pageintro"><p class="eyebrow">Review & handoff</p><h2>确认的是这一版内容，不是一个“完成”按钮</h2><p>采纳方向、模拟保存、导出文件，都不等于需求已确认。</p></div><div class="grid2"><section><article class="card"><div class="between"><h3>本期确认范围</h3>${badge('草稿 v'+S.rev)}</div><div class="fact"><label>目标</label><span>同页配置，保留原业务范围</span></div><div class="fact"><label>页面方案</label><span>${S.choice?'方案 '+S.choice+' · '+S.layout:'尚未选择'}</span></div><div class="fact"><label>业务规则</label><span>${S.rule?'冲突拒绝，原有数据保持不变':'待决定'}</span></div><div class="fact"><label>文档</label><span>PRD v${S.docRev}</span></div></article><article class="card"><h3>需要先处理的内容</h3>${issues.length?issues.map(x=>`<p class="small">${badge('待处理','amber')} ${x}</p>`).join(''):'<p class="small">演示条件已满足。正式版本仍必须使用服务端门禁。</p>'}<div class="decisionfoot inline">${button('回到方案',"nav('work');tab('options')")}${button('同步文档','syncDoc()')}${button('运行演示审查','runReview()')}</div></article></section><aside><article class="card"><h3>创建确认基线</h3><p class="muted small">确认底稿、PRD、原型的指定版本。后续修改新建草稿，不覆盖历史。</p><div class="notice" style="margin-top:16px">本页只模拟确认交互，不产生真实审批记录。</div><button class="primary" style="width:100%" ${issues.length?'disabled':''} onclick="openConfirm()">确认此版本（演示）</button></article>${S.baseline?`<article class="card"><span class="badge green">历史演示基线</span><h3 style="margin-top:9px">DEMO-BL-v${S.baseline}</h3><p class="small muted">当前草稿变更不会修改此基线。</p>${button('查看交接说明','showHandoff()')}</article>`:''}</aside></div></div>`}
function runReview(){if(!S.rule||!S.choice||S.docRev!==S.rev){toast('先处理规则、方案与文档版本，再进行审查');return}S.reviewRev=S.rev;render();toast('合成演示审查完成，不代表模型或真人审查')}
function openConfirm(){openModal('确认指定内容 · 仅演示',`<p>将模拟创建草稿 v${S.rev} 的确认基线。</p><label class="checkline"><input id="scopecheck" type="checkbox">我已核对本期范围、规则与验收条件。</label><label class="checkline"><input id="riskcheck" type="checkbox">我已了解未决项与原型模拟边界。</label><div class="notice">正式版提交版本、内容哈希及确认范围，由服务端校验。</div>`,button('返回核对','closeModal()')+button('创建演示基线','doConfirm()','primary'))}
function doConfirm(){if(!document.getElementById('scopecheck').checked||!document.getElementById('riskcheck').checked){toast('请先完成两项内容核对');return}if(blockers().length){closeModal();render();return}S.baseline=S.rev;S.events.unshift({rev:S.rev,text:'创建演示基线，不是实际确认记录'});closeModal();render();toast('演示基线已创建；不是正式应用的确认记录')}
function showHandoff(){openModal('交接包 · 设计说明','<p>正式实现从服务端已确认基线生成：</p><div class="quote">共同需求、前端说明、后端说明、验收条件、未决事项、UI 方案、追踪关系及 manifest。</div><p class="small muted">本演示不制造正式 ZIP，不伪装已有开发或测试验收结果。</p>')}
function historyPage(){return `<div class="fullpage"><div class="pageintro"><p class="eyebrow">Version history</p><h2>每次改变，都能回到依据</h2><p>以下仅为本页面产生的演示记录，刷新即重置。</p></div><div class="timeline">${S.events.map(e=>`<article class="card"><div class="between"><strong>草稿 v${e.rev}</strong>${badge('演示记录')}</div><p>${esc(e.text)}</p></article>`).join('')}</div></div>`}
function settingsPage(){return `<div class="fullpage" style="max-width:1000px"><div class="pageintro"><p class="eyebrow">Model configuration</p><h2>模型连接与凭据状态</h2><p>凭据只由后端读取。此原型不接触 .env，不请求 API。</p></div><div class="notice">全部状态是设计样例。正式版显示服务端返回值，不把“已配置”写死。</div><article class="card"><div class="between"><h3>主分析模型</h3>${badge(S.scenario==='key'?'未配置（演示）':'已配置（演示）',S.scenario==='key'?'amber':'green')}</div><div class="fact"><label>服务方</label><span>DeepSeek 官方（示例）</span></div><div class="fact"><label>接收端</label><span>https://api.deepseek.com</span></div><div class="fact"><label>密钥来源</label><span>项目根目录 .env</span></div><div class="fact"><label>变量名称</label><code>RA_DEEPSEEK_API_KEY</code></div><div class="fact"><label>密钥内容</label><span>不读取、不返回、不展示</span></div><div class="decisionfoot"><button onclick="toast('这是状态演示，未执行连接测试，也未产生费用')">演示连接反馈</button></div></article><article class="card"><h3>配置说明</h3><p class="small muted">复制 .env.example 为 .env，在本机填入密钥，重启后生效。模型切换仍需核对接收端绑定；存在密钥不等于授权发送业务材料。</p></article></div>`}
render();
</script></body></html>
